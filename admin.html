<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGAP Brownie Delight - Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>DGAP Brownie Delight - Admin Panel</h1>
        <nav>
            <a href="index.html">Menu</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="menu">Manage Menu</button>
                <button class="tab-btn" data-tab="sales">Sales Report</button>
            </div>

            <!-- Menu Management Tab -->
            <div id="menu-tab" class="tab-content active">
                <div class="menu-management">
                    <h2>Menu Management</h2>
                    
                    <div class="form-group">
                        <h3 id="form-title">Add New Item</h3>
                        <form id="menu-form">
                            <input type="hidden" id="item-id">
                            
                            <div class="form-group">
                                <label for="item-name">Item Name:</label>
                                <input type="text" id="item-name" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="item-price">Price (₹):</label>
                                <input type="number" id="item-price" min="0" step="0.01" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="item-image">Image URL or Path:</label>
                                <input type="text" id="item-image" placeholder="e.g., https://images.unsplash.com/... or double-chocolate.jpg" required>
                                <small style="color: #666; display: block; margin-top: 5px;">Enter full image URL (http/https) or local path (e.g., images/filename.jpg)</small>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="submit-btn">Add Item</button>
                                <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
                            </div>
                        </form>
                    </div>

                    <div class="menu-list" id="menu-list">
                        <!-- Menu items will be dynamically loaded here -->
                    </div>
                </div>
            </div>

            <!-- Sales Report Tab -->
            <div id="sales-tab" class="tab-content">
                <div class="sales-report">
                    <h2>Monthly Sales Report</h2>
                    
                    <div class="report-controls">
                        <label for="report-month">Select Month:</label>
                        <select id="report-month">
                            <!-- Options will be dynamically generated -->
                        </select>
                        <label for="report-year">Select Year:</label>
                        <select id="report-year">
                            <!-- Options will be dynamically generated -->
                        </select>
                        <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
                    </div>

                    <div id="report-results">
                        <!-- Report results will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
